name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

# read-only token: the job only checks the repository
permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      # actions are pinned to commits, not to movable tags/branches
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - name: HACS validation
        uses: "hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa"  # main as of 2026-06-08
        with:
          category: "integration"
