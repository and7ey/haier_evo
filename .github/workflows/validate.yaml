name: Validate

on:
  push:
  pull_request:
  # schedule:
  #   - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v3"
      - name: Discovery regression tests
        run: python3 -m unittest discover -s tests -v
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
