name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  # Home Assistant releases and betas come out on Wednesdays: on Thursday the
  # window of versions has moved, and main is checked against it without a commit
  schedule:
    - cron: "0 6 * * 4"

# read-only token: the jobs only check the repository
permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      # actions are pinned to commits, not to movable tags/branches
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - name: HACS validation
        uses: "hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa"  # main as of 2026-06-08
        with:
          category: "integration"

  hassfest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - name: Home Assistant hassfest
        uses: "home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361"  # master as of 2026-10-26

  # The versions are worked out on every run (scripts/ha_versions.py): the two
  # previous releases, the current one, the next one (beta, else the nightly
  # build) and the minimum of hacs.json once the window has left it behind.
  ha-versions:
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    outputs:
      minimum: ${{ steps.resolve.outputs.minimum }}
      prev2: ${{ steps.resolve.outputs.prev2 }}
      prev1: ${{ steps.resolve.outputs.prev1 }}
      current: ${{ steps.resolve.outputs.current }}
      next: ${{ steps.resolve.outputs.next }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - name: Work out the Home Assistant versions
        id: resolve
        run: python3 scripts/ha_versions.py >> "$GITHUB_OUTPUT"
      - name: Summary
        run: python3 scripts/ha_versions.py --summary >> "$GITHUB_STEP_SUMMARY"

  # One step per version, each in the Home Assistant container of that version.
  # A failing step does not skip the next ones; only "next" may fail.
  tests:
    needs: ha-versions
    runs-on: "ubuntu-latest"
    timeout-minutes: 45
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - name: "Home Assistant ${{ needs.ha-versions.outputs.minimum }} (minimum of hacs.json)"
        if: ${{ !cancelled() && needs.ha-versions.outputs.minimum != '' }}
        env:
          HA_TAG: ${{ needs.ha-versions.outputs.minimum }}
        run: scripts/run_checks.sh "$HA_TAG"
      - name: "Home Assistant ${{ needs.ha-versions.outputs.prev2 }} (previous but one)"
        if: ${{ !cancelled() }}
        env:
          HA_TAG: ${{ needs.ha-versions.outputs.prev2 }}
        run: scripts/run_checks.sh "$HA_TAG"
      - name: "Home Assistant ${{ needs.ha-versions.outputs.prev1 }} (previous)"
        if: ${{ !cancelled() }}
        env:
          HA_TAG: ${{ needs.ha-versions.outputs.prev1 }}
        run: scripts/run_checks.sh "$HA_TAG"
      - name: "Home Assistant ${{ needs.ha-versions.outputs.current }} (current)"
        if: ${{ !cancelled() }}
        env:
          HA_TAG: ${{ needs.ha-versions.outputs.current }}
        run: scripts/run_checks.sh "$HA_TAG"
      - name: "Home Assistant ${{ needs.ha-versions.outputs.next }} (next, does not block)"
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          HA_TAG: ${{ needs.ha-versions.outputs.next }}
        run: scripts/run_checks.sh "$HA_TAG"
