# The tests on a real Home Assistant core (scripts/run_ha_tests.sh). They need
# pytest-homeassistant-custom-component (requirements_test_ha.txt); the checks
# of tests/ do not, and run on their own (scripts/run_checks.sh).
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# a test that hangs fails: after 60 s the stacks of all threads are printed
# and the run ends (the thread method also ends a deadlock between the event
# loop and the websocket thread, which the signal method cannot interrupt)
timeout = 60
timeout_method = thread
