execute_action:
  name: Control laundry machine
  description: Send an explicit action to a washer or dryer with remote control enabled.
  target:
    entity:
      domain: haier_evo
  fields:
    action:
      required: true
      selector:
        select:
          options:
            - start
            - pause
            - resume
            - cancel

configure_program:
  name: Configure laundry program
  description: Change the selected program parameters locally without starting the appliance.
  target:
    entity:
      domain: haier_evo
  fields:
    program:
      required: true
      selector:
        text:
    parameters:
      required: true
      selector:
        object:
