# HSU09HPL303: the codes of HSU-07/09HPL203 (one line of models); confirmed on live units
# by the fork VitaliyMitrofanov/haier_evo. The louver positions are left to the
# app's screens (config.louver_layout), the switches to the cloud's description.
command_name: "4"
attributes:
  - name: current_temperature
    id: "36"
  - name: target_temperature
    id: "0"
  - name: status
    id: "19"
  - name: mode
    id: "2"
    mappings:
      - haier: "0"
        value: "auto"
      - haier: "1"
        value: "cool"
      - haier: "2"
        value: "dry"
      - haier: "4"
        value: "heat"
      - haier: "6"
        value: "fan_only"
  - name: fan_mode
    id: "4"
    mappings:
      - haier: "1"
        value: "high"
      - haier: "2"
        value: "medium"
      - haier: "3"
        value: "low"
      - haier: "5"
        value: "auto"
